<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host · Wedding Quiz</title>
  <link rel="stylesheet" href="/shared/styles.css">
  <style>
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 24px; background: var(--surface); box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 10; }
    .room-code { font-family: 'Inter'; font-weight: 700; letter-spacing: 0.1em; padding: 6px 12px; background: var(--bg); border-radius: var(--radius-sm); }
    .layout { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; padding: 24px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .qlist { display:flex; flex-direction:column; gap: 12px; }
    .qrow { background: var(--surface); border-radius: var(--radius-sm); padding: 16px; box-shadow: var(--shadow-sm); display:flex; align-items: center; gap: 12px; cursor: grab; }
    .qrow.selected { outline: 2px solid var(--rose); }
    .editor { position: sticky; top: 80px; }
    .control-deck { padding: 48px; text-align: center; }
    .big-btn { font-size: 24px; padding: 24px 48px; }
    .player-pill { display:inline-block; background: var(--bg); border-radius: 999px; padding: 4px 12px; margin: 2px; font-family: 'Inter'; font-size: 14px; }
  </style>
</head>
<body>
  <div id="saveLinkBanner" style="display:none; background: var(--gold); color: #fff; padding: 14px 24px; font-family: 'Inter'; font-weight: 500; box-shadow: var(--shadow-sm);">
    <div style="max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
      <span style="font-size: 18px;">★</span>
      <strong style="font-size: 15px;">Bookmark this page!</strong>
      <span style="font-size: 14px; opacity: 0.95;">This URL is the only way back to manage your quiz. Save it now.</span>
      <span style="flex: 1;"></span>
      <button class="btn" id="copyHostUrlBtn" style="background: rgba(255,255,255,0.2); color: #fff; min-height: 36px; padding: 6px 14px; box-shadow: none; font-size: 14px;">Copy link</button>
      <button class="btn" id="dismissBannerBtn" style="background: transparent; color: #fff; min-height: 36px; padding: 6px 10px; box-shadow: none; font-size: 14px;" aria-label="Dismiss">×</button>
    </div>
  </div>
  <div class="topbar">
    <div class="font-script" style="font-size:32px; color: var(--rose);" id="quizName">Quiz</div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <span style="color: var(--muted); font-family: 'Inter';">Code</span>
      <span class="room-code tabular" id="roomCode">------</span>
      <div style="position:relative;" id="shareMenuWrap">
        <button class="btn" id="shareMenuBtn" type="button" aria-haspopup="menu" aria-expanded="false">Share ▾</button>
        <div id="shareMenu" role="menu" style="display:none; position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border-radius:var(--radius-sm); box-shadow:var(--shadow-md); min-width:220px; padding:6px; z-index:20;">
          <a class="btn" id="joinPageBtn" target="_blank" rel="noopener" role="menuitem" style="display:block; width:100%; text-align:left; box-shadow:none; background:transparent; padding:10px 12px; min-height:0;">Show joining page (QR)</a>
          <a class="btn" id="presenterBtn" target="_blank" rel="noopener" role="menuitem" style="display:block; width:100%; text-align:left; box-shadow:none; background:transparent; padding:10px 12px; min-height:0;">Presenter mode</a>
          <button class="btn" id="copyHostUrlMenuItem" type="button" role="menuitem" style="display:block; width:100%; text-align:left; box-shadow:none; background:transparent; padding:10px 12px; min-height:0;">Copy host link</button>
        </div>
      </div>
      <button class="btn btn-primary" id="primaryBtn">Start game</button>
    </div>
  </div>
  <div id="root" aria-live="polite">
    <p style="text-align:center; padding: 80px;">Loading…</p>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/socket.js"></script>
  <script src="/host/app.js"></script>
</body>
</html>
