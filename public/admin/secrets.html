<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qyzr · admin · secrets</title>
<link rel="stylesheet" href="/shared/styles.css">
<style>
  body { background: var(--bg); min-height: 100dvh; padding: 32px 16px; font-family: 'Inter', system-ui, sans-serif; }
  .shell { max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .topbar h1 { font-family: 'Great Vibes', cursive; color: var(--rose); font-size: 56px; margin: 0; line-height: 1; }
  .topbar .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .topbar form { margin: 0; }
  .logout-btn { background: transparent; border: 1px solid #E3D9CC; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 13px; min-height: 36px; }
  .logout-btn:hover { background: var(--surface); }

  .section-title { display: flex; align-items: center; gap: 12px; margin: 32px 0 16px; font-weight: 600; font-size: 13px; color: var(--rose); text-transform: uppercase; letter-spacing: 0.18em; }
  .section-title::before, .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, #C8A8B7, transparent); }

  .card { background: var(--surface); border-radius: var(--radius-md); padding: 20px 22px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  .card-head .title { font-weight: 600; color: var(--ink); font-size: 15px; }
  .card-head .key { font-family: 'Inter', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.set { background: rgba(75, 158, 88, 0.12); color: #2F7A3A; }
  .pill.unset { background: rgba(180,137,58,0.12); color: var(--gold); }
  .help { color: var(--muted); font-size: 13px; margin: 6px 0 12px; line-height: 1.4; }
  .help a { color: var(--rose); }

  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input[type="password"], .row input[type="text"] {
    flex: 1; padding: 10px 14px; border: 1px solid #E3D9CC; border-radius: 8px;
    font-size: 14px; font-family: 'Inter', system-ui, monospace; background: var(--bg); color: var(--ink); box-sizing: border-box; min-height: 40px;
  }
  .row input:focus { outline: 2px solid var(--rose); outline-offset: 1px; border-color: var(--rose); }
  .btn { padding: 10px 16px; border: none; border-radius: 999px; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; min-height: 40px; transition: transform 120ms ease; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn-primary { background: var(--rose); color: #fff; }
  .btn-secondary { background: var(--bg); color: var(--ink); border: 1px solid #E3D9CC; }
  .btn-danger { background: transparent; color: var(--error); border: 1px solid rgba(184, 56, 56, 0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow-md); display: none; z-index: 9999; }
  .toast.show { display: block; animation: toast-pop 200ms ease-out; }
  .toast.error { background: var(--error); }
  @keyframes toast-pop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  .add-form { background: var(--surface); padding: 16px; border-radius: var(--radius-md); border: 1px dashed #C8A8B7; margin-top: 8px; }
  .add-form .row + .row { margin-top: 8px; }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1>qyzr</h1>
      <p class="sub">Admin · Secrets</p>
    </div>
    <form method="post" action="/admin/logout">
      <button type="submit" class="logout-btn">Sign out</button>
    </form>
  </div>

  <div class="section-title">Known secrets</div>
  <div id="known"></div>

  <div class="section-title">Custom keys</div>
  <div id="custom"></div>

  <div class="add-form">
    <div class="row">
      <input id="newKey" type="text" placeholder="NEW_SECRET_KEY" maxlength="64" autocomplete="off">
      <input id="newValue" type="password" placeholder="value" maxlength="8192" autocomplete="new-password">
      <button class="btn btn-primary" id="addBtn" type="button">Add</button>
    </div>
    <p class="help" style="margin: 10px 0 0;">Keys are stored as-is. Values are write-only — once saved, you can replace or delete them but not view them again.</p>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
(function () {
  const knownEl = document.getElementById('known');
  const customEl = document.getElementById('custom');
  const toastEl = document.getElementById('toast');

  function toast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { toastEl.className = 'toast'; }, 2400);
  }
  function fmtTime(ms) {
    if (!ms) return '';
    try { return 'updated ' + new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(ms)); }
    catch { return ''; }
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function linkifyHelp(s) {
    // escape first, then upgrade http(s) URL substrings to anchor tags.
    const safe = escapeHtml(s);
    const urlRe = new RegExp('(https?://[^\\s<]+)', 'g');
    return safe.replace(urlRe, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  async function load() {
    const r = await fetch('/api/admin/secrets', { credentials: 'same-origin' });
    if (r.status === 401) { location.href = '/admin/login'; return; }
    const data = await r.json();
    render(data.secrets || []);
  }

  function render(items) {
    knownEl.innerHTML = '';
    customEl.innerHTML = '';
    let hasCustom = false;
    for (const s of items) {
      const card = renderCard(s);
      if (s.known) knownEl.appendChild(card);
      else { customEl.appendChild(card); hasCustom = true; }
    }
    if (!hasCustom) {
      customEl.innerHTML = '<p class="help" style="margin: 0;">No custom secrets yet. Add one below.</p>';
    }
  }

  function renderCard(s) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.key = s.key;
    card.innerHTML = `
      <div class="card-head">
        <div>
          <div class="title">${escapeHtml(s.label || s.key)}</div>
          <div class="key">${escapeHtml(s.key)}</div>
        </div>
        <span class="pill ${s.present ? 'set' : 'unset'}">${s.present ? 'Set' : 'Not set'}</span>
      </div>
      ${s.help ? `<p class="help">${linkifyHelp(s.help)}</p>` : ''}
      <div class="row">
        <input type="password" placeholder="${s.present ? '•••••• (replace)' : 'enter value'}" autocomplete="off" maxlength="8192">
        <button class="btn btn-primary save">Save</button>
        ${s.present ? `<button class="btn btn-danger delete" title="Delete">Delete</button>` : ''}
      </div>
      ${s.updated_at ? `<p class="meta">${escapeHtml(fmtTime(s.updated_at))}</p>` : ''}
    `;
    const input = card.querySelector('input');
    const saveBtn = card.querySelector('.save');
    const delBtn = card.querySelector('.delete');
    saveBtn.addEventListener('click', async () => {
      const value = input.value;
      if (!value || !value.trim()) { toast('Enter a value', true); return; }
      saveBtn.disabled = true;
      try {
        const r = await fetch('/api/admin/secrets/' + encodeURIComponent(s.key), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ value }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          toast(e.error || 'Save failed', true);
        } else {
          toast('Saved');
          input.value = '';
          await load();
        }
      } finally { saveBtn.disabled = false; }
    });
    if (delBtn) {
      delBtn.addEventListener('click', async () => {
        if (!confirm('Delete ' + s.key + '?')) return;
        delBtn.disabled = true;
        try {
          const r = await fetch('/api/admin/secrets/' + encodeURIComponent(s.key), {
            method: 'DELETE', credentials: 'same-origin',
          });
          if (!r.ok) toast('Delete failed', true);
          else { toast('Deleted'); await load(); }
        } finally { delBtn.disabled = false; }
      });
    }
    return card;
  }

  document.getElementById('addBtn').addEventListener('click', async () => {
    const key = document.getElementById('newKey').value.trim();
    const value = document.getElementById('newValue').value;
    if (!/^[A-Z0-9_]{1,64}$/.test(key)) { toast('Key must be A–Z, 0–9, _ (≤64 chars)', true); return; }
    if (!value || !value.trim()) { toast('Enter a value', true); return; }
    const r = await fetch('/api/admin/secrets/' + encodeURIComponent(key), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin', body: JSON.stringify({ value }),
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); toast(e.error || 'Save failed', true); return; }
    toast('Saved');
    document.getElementById('newKey').value = '';
    document.getElementById('newValue').value = '';
    await load();
  });

  load();
})();
</script>
</body>
</html>
